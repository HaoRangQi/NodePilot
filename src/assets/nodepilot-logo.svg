<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">NodePilot icon</title>
  <desc id="desc">A compass pointer crossing connected version nodes inside a rounded macOS-style app icon.</desc>
  <defs>
    <linearGradient id="base" x1="128" y1="96" x2="896" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfffb" />
      <stop offset="0.48" stop-color="#e7f7f1" />
      <stop offset="1" stop-color="#d8ece6" />
    </linearGradient>
    <linearGradient id="rim" x1="184" y1="136" x2="840" y2="896" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="1" stop-color="#8fb9ad" stop-opacity="0.36" />
    </linearGradient>
    <linearGradient id="needle" x1="279" y1="746" x2="748" y2="279" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d5f58" />
      <stop offset="0.62" stop-color="#269383" />
      <stop offset="1" stop-color="#38d5b9" />
    </linearGradient>
    <linearGradient id="needleTip" x1="590" y1="224" x2="818" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffbd2e" />
      <stop offset="1" stop-color="#ff5f57" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#12352f" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#12352f" flood-opacity="0.12" />
    </filter>
    <filter id="markShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b312d" flood-opacity="0.24" />
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="226" fill="url(#base)" />
  <rect x="48" y="48" width="928" height="928" rx="188" fill="none" stroke="url(#rim)" stroke-width="28" />
  <path
    d="M208 654c82-126 194-230 331-301 74-38 154-64 237-77"
    fill="none"
    stroke="#cfe7de"
    stroke-width="54"
    stroke-linecap="round"
  />
  <path
    d="M216 651c86-116 197-210 329-279 69-36 142-60 220-73"
    fill="none"
    stroke="#286a62"
    stroke-width="26"
    stroke-linecap="round"
    stroke-dasharray="1 74"
  />

  <g filter="url(#softShadow)">
    <circle cx="272" cy="666" r="64" fill="#ffffff" />
    <circle cx="272" cy="666" r="41" fill="#aeece2" />
    <circle cx="512" cy="512" r="72" fill="#ffffff" />
    <circle cx="512" cy="512" r="45" fill="#ffdcc2" />
    <circle cx="748" cy="306" r="64" fill="#ffffff" />
    <circle cx="748" cy="306" r="40" fill="#d5e3ff" />
  </g>

  <g filter="url(#markShadow)">
    <path
      d="M263 756 470 390c18-32 62-35 84-6l94 125-128 46-75-98-132 330c-13 33-65 1-50-31Z"
      fill="url(#needle)"
    />
    <path
      d="M500 388 802 210 678 526 620 421 500 388Z"
      fill="url(#needleTip)"
    />
    <path
      d="M500 388 620 421 678 526 548 476Z"
      fill="#174640"
      opacity="0.3"
    />
  </g>

  <path
    d="M245 194c83-44 176-68 271-68 110 0 216 31 307 89"
    fill="none"
    stroke="#ffffff"
    stroke-width="22"
    stroke-linecap="round"
    opacity="0.62"
  />
</svg>
